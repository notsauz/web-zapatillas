version: '3.8'

services:
  db-zapatillas:
    image: mysql:8.0
    container_name: db-zapatillas
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zapatillas_db
      MYSQL_USER: hugo
      MYSQL_PASSWORD: 1
      MYSQL_ROOT_PASSWORD: 1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # - ./bbdd.sql:/docker-entrypoint-initdb.d/bbdd.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red-zapatillas

  app-zap:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: app-zap
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db-zapatillas
      DB_PORT: 3306
      DB_DATABASE: zapatillas_db
      DB_USERNAME: hugo
      DB_PASSWORD: 1
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    depends_on:
      db-zapatillas:
        condition: service_healthy
    command: ["php-fpm", "-F"]
    networks:
      - red-zapatillas

  nginx-zap:
    image: nginx:alpine
    container_name: nginx-zap
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-zap
    networks:
      - red-zapatillas

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin-zap
    restart: unless-stopped
    environment:
      PMA_HOST: db-zapatillas
      PMA_USER: hugo
      PMA_PASSWORD: 1
      PMA_ROOT_PASSWORD: 1
    ports:
      - "8081:80"
    depends_on:
      - db-zapatillas
    networks:
      - red-zapatillas

networks:
  red-zapatillas:
    driver: bridge

volumes:
  mysql_data: