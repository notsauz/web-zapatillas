services:
  # MySQL
  mysql:
    image: mysql:8.0
    container_name: mysql-zapatillas
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zapatillas_db
      MYSQL_ROOT_PASSWORD: 1
      MYSQL_USER: hugo
      MYSQL_PASSWORD: 1
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - red-zapatillas

  # App Laravel
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: app-zapatillas
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=zapatillas_db
      - DB_USERNAME=hugo
      - DB_PASSWORD=1
    depends_on:
      - mysql
    networks:
      - red-zapatillas

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin-zapatillas
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: hugo
      PMA_PASSWORD: 1
    depends_on:
      - mysql
    networks:
      - red-zapatillas

networks:
  red-zapatillas:
    driver: bridge

volumes:
  mysql_data: